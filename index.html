<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">

  <title>XRP Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #chart {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #top {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      padding: 8px 11px;
      border-radius: 9px;
      background: rgba(0,0,0,.75);
      pointer-events: none;
    }

    #label {
      font-size: 12px;
      font-weight: 700;
      color: #20e38b;
    }

    #price {
      margin-top: 2px;
      font-size: 22px;
      line-height: 24px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    #change {
      margin-top: 2px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div id="chart"></div>

  <div id="top">
    <div id="label">XRP/USD · LIVE</div>
    <div id="price">Connecting…</div>
    <div id="change">15-minute rolling view</div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

  <script>
    const PRODUCT = "XRP-USD";

    const WINDOW_SECONDS = 15 * 60;

    const chartElement =
      document.getElementById("chart");

    const priceElement =
      document.getElementById("price");

    const changeElement =
      document.getElementById("change");

    const labelElement =
      document.getElementById("label");

    const chart =
      LightweightCharts.createChart(
        chartElement,
        {
          width: window.innerWidth,
          height: window.innerHeight,

          layout: {
            background: {
              color: "#000000"
            },

            textColor: "#999999"
          },

          grid: {
            vertLines: {
              color: "#181818"
            },

            horzLines: {
              color: "#181818"
            }
          },

          rightPriceScale: {
            borderColor: "#333333",

            scaleMargins: {
              top: 0.15,
              bottom: 0.15
            }
          },

          timeScale: {
            borderColor: "#333333",
            timeVisible: true,
            secondsVisible: true,
            rightOffset: 3,
            barSpacing: 4
          },

          crosshair: {
            mode:
              LightweightCharts.CrosshairMode.Normal
          }
        }
      );

    const line =
      chart.addLineSeries({
        color: "#20e38b",

        lineWidth: 3,

        crosshairMarkerVisible: false,

        priceLineVisible: true,

        lastValueVisible: true
      });

    let points = [];

    let previousPrice = null;

    let firstVisiblePrice = null;

    let socket = null;

    let reconnectTimer = null;

    let lastTimestamp = 0;

    function updateHeader(price) {

      priceElement.textContent =
        "$" + price.toFixed(5);

      if (previousPrice !== null) {

        if (price > previousPrice) {

          priceElement.style.color =
            "#20e38b";

          line.applyOptions({
            color: "#20e38b"
          });

        } else if (price < previousPrice) {

          priceElement.style.color =
            "#ff4d67";
        }
      }

      previousPrice = price;

      if (firstVisiblePrice !== null) {

        const change =
          ((price - firstVisiblePrice) /
            firstVisiblePrice) *
          100;

        const prefix =
          change >= 0 ? "+" : "";

        changeElement.textContent =
          "15m  " +
          prefix +
          change.toFixed(3) +
          "%";
      }
    }

    function addPrice(price) {

      if (!Number.isFinite(price)) {
        return;
      }

      let timestamp =
        Math.floor(Date.now() / 1000);

      /*
        Lightweight Charts requires each
        newly-added line point to have a
        later timestamp than the previous
        point.

        XRP can trade multiple times inside
        one second, so advance the chart
        timestamp when necessary.
      */

      if (timestamp <= lastTimestamp) {

        timestamp =
          lastTimestamp + 1;
      }

      lastTimestamp =
        timestamp;

      points.push({
        time: timestamp,
        value: price
      });

      /*
        Keep the display focused on the
        most recent 15 minutes.
      */

      const cutoff =
        timestamp - WINDOW_SECONDS;

      while (
        points.length > 2 &&
        points[0].time < cutoff
      ) {
        points.shift();
      }

      firstVisiblePrice =
        points[0].value;

      /*
        Update ONLY the newest point.
        This is what creates the visibly
        moving live line.
      */

      line.update({
        time: timestamp,
        value: price
      });

      updateHeader(price);

      chart.timeScale().setVisibleRange({
        from: cutoff,
        to: timestamp + 10
      });
    }

    async function loadStartingData() {

      /*
        Coinbase candles give us enough
        initial history to populate the
        chart before the live feed starts.
      */

      const response =
        await fetch(
          "https://api.exchange.coinbase.com/products/" +
          PRODUCT +
          "/candles?granularity=60",
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          "History request failed"
        );
      }

      const raw =
        await response.json();

      const now =
        Math.floor(Date.now() / 1000);

      const cutoff =
        now - WINDOW_SECONDS;

      points =
        raw
          .map(candle => ({
            time:
              Number(candle[0]),

            value:
              Number(candle[4])
          }))
          .filter(
            point =>
              point.time >= cutoff
          )
          .sort(
            (a, b) =>
              a.time - b.time
          );

      if (points.length) {

        line.setData(points);

        lastTimestamp =
          points[
            points.length - 1
          ].time;

        firstVisiblePrice =
          points[0].value;

        previousPrice =
          points[
            points.length - 1
          ].value;

        updateHeader(
          previousPrice
        );
      }
    }

    function connectLive() {

      labelElement.textContent =
        "XRP/USD · CONNECTING";

      socket =
        new WebSocket(
          "wss://advanced-trade-ws.coinbase.com"
        );

      socket.onopen = () => {

        socket.send(
          JSON.stringify({
            type: "subscribe",

            product_ids: [
              PRODUCT
            ],

            channel:
              "ticker"
          })
        );
      };

      socket.onmessage = event => {

        let message;

        try {

          message =
            JSON.parse(
              event.data
            );

        } catch {

          return;
        }

        if (
          message.channel !==
          "ticker"
        ) {
          return;
        }

        const events =
          message.events || [];

        for (
          const eventItem
          of events
        ) {

          const tickers =
            eventItem.tickers || [];

          for (
            const ticker
            of tickers
          ) {

            if (
              ticker.product_id &&
              ticker.product_id !==
                PRODUCT
            ) {
              continue;
            }

            const price =
              Number(
                ticker.price
              );

            if (
              Number.isFinite(
                price
              )
            ) {

              labelElement.textContent =
                "XRP/USD · LIVE";

              addPrice(
                price
              );
            }
          }
        }
      };

      socket.onerror = () => {

        labelElement.textContent =
          "XRP/USD · FEED ERROR";
      };

      socket.onclose = () => {

        labelElement.textContent =
          "XRP/USD · RECONNECTING";

        clearTimeout(
          reconnectTimer
        );

        reconnectTimer =
          setTimeout(
            connectLive,
            1000
          );
      };
    }

    async function start() {

      try {

        await loadStartingData();

        connectLive();

      } catch (error) {

        priceElement.textContent =
          "LOAD ERROR";

        console.error(
          error
        );
      }
    }

    window.addEventListener(
      "resize",
      () => {

        chart.applyOptions({
          width:
            window.innerWidth,

          height:
            window.innerHeight
        });
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
            "visible" &&
          (!socket ||
            socket.readyState > 1)
        ) {

          connectLive();
        }
      }
    );

    start();
  </script>

</body>
</html>
