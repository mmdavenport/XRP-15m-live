<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">

  <title>XRP Live · 15m</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }

    #chart {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #status {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      z-index: 10;

      padding: 6px 9px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.70);
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 12px;
      font-weight: 600;

      pointer-events: none;
    }

    #status.live {
      color: #20e38b;
    }

    #status.error {
      color: #ff5c70;
    }
  </style>
</head>

<body>

  <div id="chart"></div>
  <div id="status">CONNECTING…</div>

  <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

  <script>
    const PRODUCT = "XRP-USD";
    const GRANULARITY = 900;

    const chartContainer =
      document.getElementById("chart");

    const status =
      document.getElementById("status");

    const chart =
      LightweightCharts.createChart(
        chartContainer,
        {
          width: window.innerWidth,
          height: window.innerHeight,

          layout: {
            background: {
              color: "#000000"
            },

            textColor: "#ffffff"
          },

          grid: {
            vertLines: {
              color: "#1d1d1d"
            },

            horzLines: {
              color: "#1d1d1d"
            }
          },

          rightPriceScale: {
            borderColor: "#333333"
          },

          timeScale: {
            borderColor: "#333333",
            timeVisible: true,
            secondsVisible: false,
            rightOffset: 4,
            barSpacing: 8
          },

          crosshair: {
            mode:
              LightweightCharts.CrosshairMode.Normal
          }
        }
      );

    const candleSeries =
      chart.addCandlestickSeries({
        upColor: "#20e38b",
        downColor: "#ff4d67",

        borderUpColor: "#20e38b",
        borderDownColor: "#ff4d67",

        wickUpColor: "#20e38b",
        wickDownColor: "#ff4d67"
      });

    let currentCandle = null;

    function getCandleTime(unixTime) {
      return (
        Math.floor(
          unixTime / GRANULARITY
        ) * GRANULARITY
      );
    }

    async function loadHistory() {
      const url =
        "https://api.exchange.coinbase.com/products/" +
        PRODUCT +
        "/candles?granularity=" +
        GRANULARITY;

      const response =
        await fetch(url, {
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error(
          "History request failed"
        );
      }

      const data =
        await response.json();

      const formatted =
        data
          .map(candle => ({
            time: Number(candle[0]),
            low: Number(candle[1]),
            high: Number(candle[2]),
            open: Number(candle[3]),
            close: Number(candle[4])
          }))
          .sort(
            (a, b) =>
              a.time - b.time
          );

      candleSeries.setData(
        formatted
      );

      currentCandle =
        formatted[
          formatted.length - 1
        ];

      chart
        .timeScale()
        .scrollToRealTime();
    }

    function connectLiveFeed() {
      const socket =
        new WebSocket(
          "wss://advanced-trade-ws.coinbase.com"
        );

      socket.onopen = () => {
        status.textContent =
          "XRP/USD · 15m · LIVE";

        status.className =
          "live";

        socket.send(
          JSON.stringify({
            type: "subscribe",

            product_ids: [
              PRODUCT
            ],

            channel:
              "market_trades"
          })
        );
      };

      socket.onmessage = event => {
        let message;

        try {
          message =
            JSON.parse(
              event.data
            );
        } catch {
          return;
        }

        if (
          message.channel !==
          "market_trades"
        ) {
          return;
        }

        const events =
          message.events || [];

        for (
          const eventItem
          of events
        ) {
          const trades =
            eventItem.trades || [];

          for (
            const trade
            of trades
          ) {
            const price =
              Number(
                trade.price
              );

            if (
              !Number.isFinite(
                price
              )
            ) {
              continue;
            }

            const tradeTime =
              trade.time
                ? Math.floor(
                    new Date(
                      trade.time
                    ).getTime() /
                      1000
                  )
                : Math.floor(
                    Date.now() /
                      1000
                  );

            const candleTime =
              getCandleTime(
                tradeTime
              );

            if (
              !currentCandle ||
              currentCandle.time !==
                candleTime
            ) {
              currentCandle = {
                time:
                  candleTime,

                open:
                  price,

                high:
                  price,

                low:
                  price,

                close:
                  price
              };
            } else {
              currentCandle.high =
                Math.max(
                  currentCandle.high,
                  price
                );

              currentCandle.low =
                Math.min(
                  currentCandle.low,
                  price
                );

              currentCandle.close =
                price;
            }

            candleSeries.update(
              currentCandle
            );

            chart
              .timeScale()
              .scrollToRealTime();
          }
        }
      };

      socket.onerror = () => {
        status.textContent =
          "LIVE FEED ERROR";

        status.className =
          "error";
      };

      socket.onclose = () => {
        status.textContent =
          "RECONNECTING…";

        status.className = "";

        setTimeout(
          connectLiveFeed,
          1500
        );
      };
    }

    async function start() {
      try {
        await loadHistory();

        connectLiveFeed();
      } catch (error) {
        status.textContent =
          "LOAD ERROR";

        status.className =
          "error";

        console.error(
          error
        );
      }
    }

    window.addEventListener(
      "resize",
      () => {
        chart.applyOptions({
          width:
            window.innerWidth,

          height:
            window.innerHeight
        });
      }
    );

    start();
  </script>

</body>
</html>
